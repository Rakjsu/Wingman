[package]
name = "wingman"
version = "0.1.0"
description = "Wingman — a friendly GUI for winget"
authors = ["rakjs"]
edition = "2021"

[lib]
name = "wingman_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Wingman"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread"] }
anyhow = "1"
thiserror = "2"
encoding_rs = "0.8"
